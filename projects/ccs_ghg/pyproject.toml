[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs_ghg"
version = "1.0.0"
description = "Greenhouse-gas and 45Q accounting pipeline for federally subsidized Gulf Coast CCS, as used in Gulden, Buonocore & Harvey (2026)."
readme = "readme.md"
license = {text = "CC-BY-NC-4.0"}
requires-python = ">=3.9"
authors = [
    {name = "Lindsey Gulden", email = "gulden@mit.edu"},
    {name = "Jonathan Buonocore"},
    {name = "Chris Harvey"},
]
keywords = ["carbon capture", "CCS", "45Q", "methane leakage", "greenhouse gas", "enhanced oil recovery", "LCA"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.0",
    "geopandas>=0.13",
    "kaleido>=0.2.1",
    "matplotlib>=3.6",
    "numpy>=1.23",
    "pandas>=2.0",
    "plotly>=5.15",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "seaborn>=0.12",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "jupyter-black>=0.3",
]

[project.urls]
Contact = "mailto:gulden@mit.edu"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccs_ghg*"]
exclude = ["notebooks*", "data*", "paper*", "tests*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
